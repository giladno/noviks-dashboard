name: Validate

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npx eslint .

      - name: Build project
        run: npm run build

      - name: Check build output exists
        run: |
          if [ ! -f dist/noviks-dashboard.js ]; then
            echo "Build failed: dist/noviks-dashboard.js not found"
            exit 1
          fi
          echo "Build successful: dist/noviks-dashboard.js created"
